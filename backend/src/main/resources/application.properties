spring.application.name=campusfind
server.port=${PORT:8080}

# Configure these environment variables on your hosting provider.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lostfound?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

lostfound.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.thymeleaf.cache=false

# Netlify frontend origin. Set FRONTEND_ORIGIN in production if the URL changes.
lostfound.frontend-origin=${FRONTEND_ORIGIN:https://aquamarine-bubblegum-562feb.netlify.app}
